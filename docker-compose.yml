# =============================================================================
# Docker Compose для Telegram Support Bot — ЛОКАЛЬНАЯ РАЗРАБОТКА
# =============================================================================
#
# Production живёт в Coolify: там приложение, PostgreSQL и Redis заведены
# отдельными ресурсами, HTTPS и домен обслуживает встроенный прокси Coolify.
# Этот файл на прод не выкладывается — см. docs/deployment.md
#
# ЗАПУСК:
#
#   docker compose build        # собрать образ локально
#   docker compose up -d        # запустить все сервисы
#
#   docker-compose.override.yml подключается автоматически и открывает порты
#   на localhost: приложение 3000, PostgreSQL 5433, Redis 6380
#
# ЛОГИКА:
#   - image: используется при `docker compose pull` (образ из ghcr.io)
#   - build: используется при `docker compose build` (локальная сборка)
#
# =============================================================================

name: support-bot

services:
  # ---------------------------------------------------------------------------
  # App - основное приложение (бот + HTTP сервер)
  # ---------------------------------------------------------------------------
  app:
    image: ghcr.io/weselow/telegram-support-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: support-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - support-bot-network

  # ---------------------------------------------------------------------------
  # PostgreSQL - основная база данных
  # Порты открываются только в docker-compose.override.yml (localhost)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: support-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: support_bot
    # Начиная с 18-й версии официальный образ хранит данные в подкаталоге с
    # номером версии (/var/lib/postgresql/18/docker) — так рядом уживаются две
    # версии и работает переход через pg_upgrade. Подключать нужно весь каталог
    # /var/lib/postgresql: со старым путём /var/lib/postgresql/data образ 18
    # отказывается стартовать и уходит в бесконечный перезапуск.
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - support-bot-network

  # ---------------------------------------------------------------------------
  # Redis - кэш, очереди BullMQ, rate limiting
  # Порты открываются только в docker-compose.override.yml (localhost)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: support-bot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./.volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - support-bot-network

networks:
  support-bot-network:
    driver: bridge
