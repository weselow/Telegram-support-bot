# =============================================================================
# Docker Compose Override — Development
# =============================================================================
#
# Этот файл автоматически загружается при `docker compose up`
# Добавляет dev-порты для локального доступа
#
# =============================================================================

services:
  app:
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    ports:
      # Для pgAdmin, DBeaver и т.д.
      - "127.0.0.1:5433:5432"

  redis:
    ports:
      # Для redis-cli, RedisInsight
      - "127.0.0.1:6380:6379"
