# =============================================================================
# Deploy Workflow
# =============================================================================
#
# Триггер: push в main (после успешных тестов)
#
# Шаги:
#   1. Build Docker образ
#   2. Push в GitHub Container Registry (latest + previous + sha)
#   3. Дёрнуть webhook развёртывания Coolify
#   4. Дождаться, пока /health на боевом домене снова отвечает
#
# Переменные окружения приложения (BOT_TOKEN, DATABASE_URL и прочие) живут
# в Coolify, а не здесь — см. docs/deployment.md
#
# Требуемые secrets:
#   - COOLIFY_WEBHOOK (адрес webhook развёртывания, содержит uuid ресурса)
#   - COOLIFY_TOKEN (токен API Coolify с правом deploy)
#
# Требуемые variables:
#   - SUPPORT_DOMAIN (боевой домен, например chat.dellshop.ru)
#
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/test.yml'  # Изменения в тестовом workflow
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
  workflow_dispatch: # Ручной запуск (для принудительного деплоя)

# Отменить предыдущие запуски при новом push
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Сначала прогоняем тесты
  # ---------------------------------------------------------------------------
  test:
    uses: ./.github/workflows/test.yml

  # ---------------------------------------------------------------------------
  # Build и Push образа
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Переименовать текущий latest в previous (для отката)
      - name: Tag previous image
        continue-on-error: true # Игнорировать если previous не существует
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:previous || true
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:previous || true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy: Coolify скачивает свежий образ и перезапускает приложение
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Coolify deployment
        run: |
          set -euo pipefail
          # COOLIFY_WEBHOOK уже содержит ?uuid=<ресурс>, поэтому добавляем через &
          # force=true — перекачать образ, даже если метка latest не изменилась
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_WEBHOOK }}&force=true"

      - name: Wait for the app to come back
        run: |
          set -euo pipefail

          # Выкатка без простоя выключена (бот работает на long polling),
          # поэтому старый контейнер сначала гаснет — ждём, чтобы не поймать
          # ответ уходящей версии.
          sleep 30

          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 10 "https://${{ vars.SUPPORT_DOMAIN }}/health" || true)

            if [ "$code" = "200" ]; then
              echo "Health check OK after ${attempt} attempt(s)"
              exit 0
            fi

            echo "Attempt ${attempt}: /health returned ${code}, retry in 10s"
            sleep 10
          done

          echo "Health check failed: /health did not answer 200 within 5 minutes"
          exit 1
